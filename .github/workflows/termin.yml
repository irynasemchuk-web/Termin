name: Termin check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python check_termin.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOP_SECONDS: "150"
          BOOKING_NAME: ${{ secrets.BOOKING_NAME }}
          BOOKING_BIRTHDATE: ${{ secrets.BOOKING_BIRTHDATE }}
          BOOKING_EMAIL: ${{ secrets.BOOKING_EMAIL }}
          BOOKING_PHONE: ${{ secrets.BOOKING_PHONE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
